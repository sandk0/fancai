# Development with SSL support
# Extends docker-compose.dev.yml and adds Caddy with auto-HTTPS

services:
  # Caddy with SSL for development (auto-HTTPS via Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    container_name: bookreader_caddy_dev
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./backend/storage:/var/www/storage:ro
      - frontend_build:/var/www/frontend:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - bookreader_network

  # Backend from dev config
  backend:
    extends:
      file: docker-compose.dev.yml
      service: backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"  # Expose for direct access during dev

  # Frontend from dev config
  frontend:
    extends:
      file: docker-compose.dev.yml
      service: frontend
    environment:
      - VITE_API_URL=https://${DOMAIN_NAME:-localhost}/api/v1
      - VITE_WS_URL=wss://${DOMAIN_NAME:-localhost}/ws
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL
  postgres:
    extends:
      file: docker-compose.dev.yml
      service: postgres

  # Redis
  redis:
    extends:
      file: docker-compose.dev.yml
      service: redis

  # Celery worker
  celery-worker:
    extends:
      file: docker-compose.dev.yml
      service: celery-worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery beat (optional)
  celery-beat:
    extends:
      file: docker-compose.yml
      service: celery-beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-bookreader_dev}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRET_KEY=${SECRET_KEY}

volumes:
  postgres_data:
  redis_data:
  uploaded_books:
  nlp_nltk_data:
  nlp_stanza_models:
  beat_schedule:
  caddy_data:
  caddy_config:
  frontend_build:

networks:
  bookreader_network:
    driver: bridge
