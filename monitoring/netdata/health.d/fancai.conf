# Netdata health alerts — fancai бизнес-метрики
# Документация: https://learn.netdata.cloud/docs/alerting/health-configuration-reference
#
# Эти алерты используют метрики из go.d/prometheus.conf (скрейпинг /api/v1/health/metrics)

# ─── API Error Rate ────────────────────────────────────────────────────────────
# Алерт: доля 5xx ответов превышает 5% за последние 5 минут

 alarm: fancai_api_high_error_rate
    on: prometheus_fancai_backend.http_requests_total
lookup: sum -5m unaligned of status_5xx
 units: requests
  calc: $this / (prometheus_fancai_backend.http_requests_total.total > 0 ? prometheus_fancai_backend.http_requests_total.total : 1) * 100
 every: 60s
  warn: $this > 5
  crit: $this > 20
  info: HTTP 5xx error rate (%) over the last 5 minutes
    to: sysadmin

# ─── API Latency ───────────────────────────────────────────────────────────────
# Алерт: p95 задержка API превышает 5 секунд

 alarm: fancai_api_high_latency
    on: prometheus_fancai_backend.http_request_duration_seconds_bucket
lookup: max -5m unaligned
 units: seconds
  calc: $this
 every: 60s
  warn: $this > 5
  crit: $this > 10
  info: API p95 latency (seconds) over the last 5 minutes
    to: sysadmin
