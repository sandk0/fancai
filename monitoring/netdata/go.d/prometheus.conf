# Netdata go.d Prometheus collector — скрейпинг бизнес-метрик fancai
# Документация: https://learn.netdata.cloud/docs/data-collection/apm/prometheus
#
# Netdata работает в host network_mode → localhost:8000 = бэкенд на хосте
# Если бэкенд не проброшен на хост — использовать Docker bridge IP (172.22.0.x)

jobs:
  - name: fancai_backend
    url: http://localhost:8000/api/v1/health/metrics
    username: ${METRICS_USER}
    password: ${METRICS_PASSWORD}
    update_every: 15
