# Мониторинг-стек fancai v2
# 4 сервиса: Netdata + VictoriaMetrics + Uptime Kuma + Dozzle
# Заменяет: Grafana + Prometheus + Loki + Promtail + Node Exporter + cAdvisor
# Экономия RAM: ~1.5GB -> ~500MB
# Note: version field removed (obsolete in Compose V2)

services:
  # ─── Netdata — системные метрики хоста + бизнес-метрики fancai ───────────────
  netdata:
    image: netdata/netdata:v2.10.4
    container_name: fancai_netdata
    hostname: fancai-prod
    pid: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:19999:19999"
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Кастомные конфиги
      - ./monitoring/netdata/go.d/prometheus.conf:/etc/netdata/go.d/prometheus.conf:ro
      - ./monitoring/netdata/exporting.conf:/etc/netdata/exporting.conf:ro
      - ./monitoring/netdata/health.d/fancai.conf:/etc/netdata/health.d/fancai.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - monitoring_net

  # ─── VictoriaMetrics — долгосрочное хранение метрик от Netdata ───────────────
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    container_name: fancai_victoriametrics
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vm_data:/storage
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -selfScrapeInterval=10s
      - -memory.allowedPercent=80
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - monitoring_net

  # ─── Uptime Kuma — мониторинг доступности сервисов ───────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    container_name: fancai_uptime_kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma_data:/app/data
    deploy:
      resources:
        limits:
          # Было 128M при фактическом потреблении ~96 % — контейнер жил
          # на грани OOM. Приведено к уровню netdata и victoria-metrics.
          memory: 256M
    networks:
      - monitoring_net
      - fancai_network  # Доступ к PostgreSQL и Redis для health checks

  # ─── Dozzle — просмотр логов Docker-контейнеров в реальном времени ──────────
  # Auth: порт на 127.0.0.1 — доступ только через Caddy basic_auth
  dozzle:
    image: amir20/dozzle:v10.6.14
    container_name: fancai_dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - monitoring_net

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  vm_data:
  kuma_data:

networks:
  monitoring_net:
    driver: bridge
  fancai_network:
    external: true
    name: fancai_network
