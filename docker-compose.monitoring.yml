# Мониторинг-стек fancai v2
# 5 сервисов: Netdata + VictoriaMetrics + Uptime Kuma + Dozzle + Flower
# Заменяет: Grafana + Prometheus + Loki + Promtail + Node Exporter + cAdvisor
# Экономия RAM: ~1.5GB -> ~500MB
# Note: version field removed (obsolete in Compose V2)

services:
  # ─── Netdata — системные метрики хоста + бизнес-метрики fancai ───────────────
  netdata:
    image: netdata/netdata:stable
    container_name: bookreader_netdata
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Кастомные конфиги
      - ./monitoring/netdata/go.d/prometheus.conf:/etc/netdata/go.d/prometheus.conf:ro
      - ./monitoring/netdata/exporting.conf:/etc/netdata/exporting.conf:ro
      - ./monitoring/netdata/health.d/fancai.conf:/etc/netdata/health.d/fancai.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M
    # ВАЖНО: network_mode=host — НЕ включать в bridge-сети

  # ─── VictoriaMetrics — долгосрочное хранение метрик от Netdata ───────────────
  victoriametrics:
    image: victoriametrics/victoria-metrics:stable
    container_name: bookreader_victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/storage
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -selfScrapeInterval=10s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - monitoring_net

  # ─── Uptime Kuma — мониторинг доступности сервисов ───────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: bookreader_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - kuma_data:/app/data
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - monitoring_net

  # ─── Dozzle — просмотр логов Docker-контейнеров в реальном времени ──────────
  dozzle:
    image: amir20/dozzle:v10
    container_name: bookreader_dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_AUTH_PROVIDER=none
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - monitoring_net

  # ─── Flower — мониторинг Celery задач и воркеров ─────────────────────────────
  flower:
    image: mher/flower:2
    container_name: bookreader_flower
    restart: unless-stopped
    command: >
      celery
      --broker=redis://:${REDIS_PASSWORD}@redis:6379/1
      flower
      --port=5555
      --address=0.0.0.0
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - monitoring_net
      - fancai_network  # Flower нужен доступ к Redis в основной сети

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  vm_data:
  kuma_data:

networks:
  monitoring_net:
    driver: bridge
  fancai_network:
    external: true
    name: fancai_network
