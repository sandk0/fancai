# Вариант B: EC2 + RDS - Tier 1 (Base) - РЕКОМЕНДУЕТСЯ
# EC2: t3.small (2 vCPU, 2 GB RAM)
# RDS: db.t4g.micro (1 GB RAM) - Free Tier!
# ElastiCache: cache.t3.micro (0.5 GB) - Free Tier!
# Стоимость: ~$37/мес (с Free Tier) / ~$68/мес (без)
# Пользователи: до 500
#
# Использование:
#   docker-compose -f docker-compose.ec2-rds.tier1.yml up -d
#
# ВАЖНО: Требуется настроить .env.tier1 с endpoints RDS и ElastiCache

version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-backend
    restart: always
    env_file:
      - .env.tier1
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'

  # Celery Worker
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery
    restart: always
    env_file:
      - .env.tier1
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'

  # Celery Beat
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-beat
    restart: always
    env_file:
      - .env.tier1
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - celery-worker
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'

  # Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: fancai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

volumes:
  backend_storage:

# Лимиты памяти (только приложение, DB/Redis внешние):
# - Backend: 1 GB
# - Celery Worker: 768 MB
# - Celery Beat: 256 MB
# - Nginx: 128 MB
# ИТОГО: ~2.1 GB (подходит для t3.small с 2 GB)
#
# Внешние сервисы:
# - RDS db.t4g.micro: 1 GB RAM
# - ElastiCache cache.t3.micro: 0.5 GB RAM
