# Вариант B: EC2 + RDS - Tier 3 (Pro)
# EC2: t3.large (2 vCPU, 8 GB RAM)
# RDS: db.t4g.medium (4 GB RAM)
# ElastiCache: cache.t3.medium (3 GB)
# Стоимость: ~$279/мес
# Пользователи: 2000-5000
#
# Использование:
#   docker-compose -f docker-compose.ec2-rds.tier3.yml up -d

version: '3.8'

services:
  # Backend API (Pro)
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-backend
    restart: always
    env_file:
      - .env.tier3
    environment:
      - WORKERS_COUNT=8
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # Backend API Replica (for load distribution)
  backend-replica:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-backend-2
    restart: always
    env_file:
      - .env.tier3
    environment:
      - WORKERS_COUNT=8
    ports:
      - "8001:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # Celery Worker (Pro)
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery
    restart: always
    env_file:
      - .env.tier3
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=6
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '0.75'

  # Celery Worker for images
  celery-worker-images:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery-images
    restart: always
    env_file:
      - .env.tier3
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q images
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Celery Worker for extraction
  celery-worker-extraction:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery-extraction
    restart: always
    env_file:
      - .env.tier3
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q extraction
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Celery Beat
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-beat
    restart: always
    env_file:
      - .env.tier3
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - celery-worker
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'

  # Nginx with load balancing
  nginx:
    image: nginx:1.27-alpine
    container_name: fancai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-tier3.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - backend-replica
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

volumes:
  backend_storage:

# Лимиты памяти:
# - Backend (×2): 4 GB
# - Celery Worker: 1.5 GB
# - Celery Worker Images: 1 GB
# - Celery Worker Extraction: 1 GB
# - Celery Beat: 256 MB
# - Nginx: 256 MB
# ИТОГО: ~8 GB (подходит для t3.large с 8 GB)
#
# Внешние сервисы:
# - RDS db.t4g.medium: 4 GB RAM
# - ElastiCache cache.t3.medium: 3 GB RAM
