# Вариант A: Single EC2 - Tier 2 (Enhanced)
# EC2: t3.medium (2 vCPU, 4 GB RAM)
# Стоимость: ~$85/мес
# Пользователи: 500-2000
#
# Использование:
#   docker-compose -f docker-compose.single-ec2.tier2.yml up -d

version: '3.8'

services:
  # PostgreSQL в Docker (Enhanced)
  postgres:
    image: postgres:17-alpine
    container_name: fancai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-fancai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-fancai}
      # Оптимизация для 2GB выделенной памяти
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fancai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'

  # Redis в Docker (Enhanced)
  redis:
    image: redis:7.4-alpine
    container_name: fancai-redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: '0.25'

  # Backend API (Enhanced)
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-backend
    restart: always
    env_file:
      - .env.tier2
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-fancai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fancai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - WORKERS_COUNT=4
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'

  # Celery Worker (Enhanced - 2 workers)
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery
    restart: always
    env_file:
      - .env.tier2
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-fancai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fancai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=3
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'

  # Celery Beat
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-beat
    restart: always
    env_file:
      - .env.tier2
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-fancai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fancai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - celery-worker
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: fancai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

volumes:
  postgres_data:
  redis_data:
  backend_storage:

# Лимиты памяти:
# - PostgreSQL: 1 GB
# - Redis: 600 MB
# - Backend: 1 GB
# - Celery Worker: 768 MB
# - Celery Beat: 128 MB
# - Nginx: 128 MB
# ИТОГО: ~3.6 GB (подходит для t3.medium с 4 GB)
