# Вариант B: EC2 + RDS - Tier 2 (Enhanced)
# EC2: t3.medium (2 vCPU, 4 GB RAM)
# RDS: db.t4g.small (2 GB RAM)
# ElastiCache: cache.t3.small (1.5 GB)
# Стоимость: ~$136/мес
# Пользователи: 500-2000
#
# Использование:
#   docker-compose -f docker-compose.ec2-rds.tier2.yml up -d

version: '3.8'

services:
  # Backend API (Enhanced)
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-backend
    restart: always
    env_file:
      - .env.tier2
    environment:
      - WORKERS_COUNT=4
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1'

  # Celery Worker (Enhanced)
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery
    restart: always
    env_file:
      - .env.tier2
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'

  # Second Celery Worker for heavy tasks
  celery-worker-heavy:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery-heavy
    restart: always
    env_file:
      - .env.tier2
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 -Q heavy,images
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'

  # Celery Beat
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-beat
    restart: always
    env_file:
      - .env.tier2
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - celery-worker
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'

  # Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: fancai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

volumes:
  backend_storage:

# Лимиты памяти:
# - Backend: 1.5 GB
# - Celery Worker: 1 GB
# - Celery Worker Heavy: 768 MB
# - Celery Beat: 256 MB
# - Nginx: 128 MB
# ИТОГО: ~3.6 GB (подходит для t3.medium с 4 GB)
#
# Внешние сервисы:
# - RDS db.t4g.small: 2 GB RAM
# - ElastiCache cache.t3.small: 1.5 GB RAM
