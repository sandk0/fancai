# Вариант C: Lightsail - Tier 1 (Base)
# Lightsail Instance: 2 vCPU, 2 GB RAM, 60 GB SSD
# Lightsail Database: 1 GB RAM
# Стоимость: ~$37/мес
# Пользователи: до 500
#
# Использование:
#   docker-compose -f docker-compose.lightsail.tier1.yml up -d
#
# ВАЖНО: Redis работает в Docker, PostgreSQL - Lightsail Managed DB

version: '3.8'

services:
  # Redis в Docker (Lightsail не имеет managed Redis)
  redis:
    image: redis:7.4-alpine
    container_name: fancai-redis
    restart: always
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-backend
    restart: always
    env_file:
      - .env.lightsail.tier1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'

  # Celery Worker
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery
    restart: always
    env_file:
      - .env.lightsail.tier1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Celery Beat
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-beat
    restart: always
    env_file:
      - .env.lightsail.tier1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - celery-worker
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: fancai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

volumes:
  redis_data:
  backend_storage:

# Лимиты памяти:
# - Redis: 256 MB
# - Backend: 768 MB
# - Celery Worker: 512 MB
# - Celery Beat: 128 MB
# - Nginx: 64 MB
# ИТОГО: ~1.7 GB (подходит для Lightsail 2 GB)
#
# Внешние сервисы:
# - Lightsail Database: 1 GB RAM
