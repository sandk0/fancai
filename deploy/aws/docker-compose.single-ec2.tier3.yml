# Вариант A: Single EC2 - Tier 3 (Pro)
# EC2: t3.large (2 vCPU, 8 GB RAM)
# Стоимость: ~$140/мес
# Пользователи: 2000-5000
#
# Использование:
#   docker-compose -f docker-compose.single-ec2.tier3.yml up -d

version: '3.8'

services:
  # PostgreSQL в Docker (Pro)
  postgres:
    image: postgres:17-alpine
    container_name: fancai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-fancai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-fancai}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c work_mem=32MB
      -c max_connections=400
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fancai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # Redis в Docker (Pro)
  redis:
    image: redis:7.4-alpine
    container_name: fancai-redis
    restart: always
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1200M
          cpus: '0.5'

  # Backend API (Pro - multiple workers)
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-backend
    restart: always
    env_file:
      - .env.tier3
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-fancai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fancai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - WORKERS_COUNT=8
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # Celery Worker (Pro - high concurrency)
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery
    restart: always
    env_file:
      - .env.tier3
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-fancai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fancai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=6
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1'

  # Second Celery Worker for image generation
  celery-worker-images:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-celery-images
    restart: always
    env_file:
      - .env.tier3
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-fancai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fancai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q images
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Celery Beat
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.lite.prod
    container_name: fancai-beat
    restart: always
    env_file:
      - .env.tier3
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-fancai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-fancai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - celery-worker
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: fancai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

volumes:
  postgres_data:
  redis_data:
  backend_storage:

# Лимиты памяти:
# - PostgreSQL: 2 GB
# - Redis: 1.2 GB
# - Backend: 2 GB
# - Celery Worker: 1.5 GB
# - Celery Worker Images: 1 GB
# - Celery Beat: 128 MB
# - Nginx: 128 MB
# ИТОГО: ~8 GB (подходит для t3.large с 8 GB)
