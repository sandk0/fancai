# =============================================================================
# Production Docker Compose for fancai
# =============================================================================
# Production deployment — all AI via OpenRouter (LLM + images).
#
# Memory requirements (optimized for 32GB server, 12 vCPU):
# - PostgreSQL: 12GB (with shared_buffers=4GB)
# - Redis: 768MB (maxmemory=640mb)
# - Backend: 2GB
# - Celery Worker: 4GB (NLP: PyTorch + GLiNER2 + sentence-transformers)
# - Celery Beat: 256MB
# - Caddy: 128MB
# - Frontend: 256MB (build-only, exits after completing)
# - pgbackup: 256MB
# Total: ~20.5GB (leaving 11.5GB for OS + headroom)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # Caddy Reverse Proxy with Auto-HTTPS and HTTP/3
  caddy:
    image: caddy:2.11.4-alpine
    container_name: fancai_caddy
    environment:
      - MONITOR_PASSWORD_HASH=${MONITOR_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./backend/storage:/var/www/storage:ro
      - frontend_build:/var/www/frontend:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fancai_network
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Frontend Production Build (outputs to shared volume, exits after build)
  frontend:
    image: fancai-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Значения подставляет деплой-скрипт:
        #   VCS_REF=$(git rev-parse HEAD) BUILD_DATE=$(date -u +%FT%TZ) docker compose build
        - VCS_REF=${VCS_REF:-unknown}
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - IMAGE_VERSION=${IMAGE_VERSION:-unknown}
        - VITE_API_BASE_URL=/api/v1
        - VITE_WS_URL=${DOMAIN_URL:-http://localhost}/ws
        - VITE_APP_NAME=fancai
        - VITE_HAWK_TOKEN=${HAWK_TOKEN:-}
    container_name: fancai_frontend
    volumes:
      - frontend_build:/var/www/html    # shared volume: frontend пишет, caddy читает
    restart: "no"                        # контейнер завершается после build
    networks:
      - fancai_network

  # Backend API
  backend:
    image: fancai-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        - VCS_REF=${VCS_REF:-unknown}
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - IMAGE_VERSION=${IMAGE_VERSION:-unknown}
    container_name: fancai_backend
    init: true
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Environment
      - DEBUG=false
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # CORS and Domain
      - CORS_ORIGINS=${DOMAIN_URL:-http://localhost}
      - ALLOWED_HOSTS=${DOMAIN_NAME:-localhost},localhost,127.0.0.1
      # AI — OpenRouter (all LLM + images)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # AI — Gemini Direct / Vertex (Stage A, за флагом AI_PROVIDER; дефолты = прод не тронут)
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - GEMINI_BACKEND=${GEMINI_BACKEND:-developer}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GCP_PROJECT=${GCP_PROJECT:-}
      - GCP_LOCATION=${GCP_LOCATION:-global}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      # Web Push (VAPID) - required for PWA notifications
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@fancai.ru}
      # Email — Yandex Cloud Postbox
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@fancai.ru}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-fancai}
      - PASSWORD_RESET_BASE_URL=${PASSWORD_RESET_BASE_URL:-https://fancai.ru/reset-password}
      - YANDEX_POSTBOX_ACCESS_KEY=${YANDEX_POSTBOX_ACCESS_KEY:-}
      - YANDEX_POSTBOX_SECRET_KEY=${YANDEX_POSTBOX_SECRET_KEY:-}
      - YANDEX_POSTBOX_ENDPOINT=${YANDEX_POSTBOX_ENDPOINT:-https://postbox.cloud.yandex.net}
      - YANDEX_POSTBOX_REGION=${YANDEX_POSTBOX_REGION:-ru-central1}
      # Monitoring
      - HAWK_TOKEN=${HAWK_TOKEN:-}
      - METRICS_PASSWORD=${METRICS_PASSWORD:-}
      # Performance
      - WORKERS_COUNT=${WORKERS_COUNT:-2}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
    volumes:
      - ./backend/storage:/app/storage
      - /dev/shm:/dev/shm
      - ./secrets:/secrets:ro     # Vertex service-account JSON (см. GOOGLE_APPLICATION_CREDENTIALS)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fancai_network
    healthcheck:
      test: [ "CMD", "python", "/app/healthcheck.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 768M

  # Celery Worker (NLP: PyTorch + GLiNER2 + sentence-transformers)
  celery-worker:
    image: fancai-celery:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
      args:
        - VCS_REF=${VCS_REF:-unknown}
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - IMAGE_VERSION=${IMAGE_VERSION:-unknown}
    container_name: fancai_celery
    init: true
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # AI — OpenRouter (all LLM + images)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # AI — Gemini Direct / Vertex (Stage A, за флагом AI_PROVIDER; дефолты = прод не тронут)
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - GEMINI_BACKEND=${GEMINI_BACKEND:-developer}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GCP_PROJECT=${GCP_PROJECT:-}
      - GCP_LOCATION=${GCP_LOCATION:-global}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      # NLP — HuggingFace model cache
      - HF_HOME=/models
      # Monitoring
      - HAWK_TOKEN=${HAWK_TOKEN:-}
      - METRICS_PASSWORD=${METRICS_PASSWORD:-}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      # Web Push (VAPID) - required for PWA notifications from Celery tasks
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@fancai.ru}
    volumes:
      - ./backend/storage:/app/storage
      - /dev/shm:/dev/shm
      - nlp_models:/models
      - ./secrets:/secrets:ro     # Vertex service-account JSON (см. GOOGLE_APPLICATION_CREDENTIALS)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping --timeout 10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    networks:
      - fancai_network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Celery Beat Scheduler
  celery-beat:
    image: fancai-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fancai_beat
    command: >
      celery -A app.core.celery_app beat --loglevel=${LOG_LEVEL:-info} --schedule=/tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Monitoring
      - HAWK_TOKEN=${HAWK_TOKEN:-}
      - METRICS_PASSWORD=${METRICS_PASSWORD:-}
    volumes:
      - beat_schedule:/tmp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fancai_network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # PostgreSQL Database (optimized for 32GB server, 12 vCPU)
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: fancai_postgres
    shm_size: 10g
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=4GB
      -c effective_cache_size=8GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c huge_pages=try
      -c wal_compression=zstd
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c max_parallel_workers_per_gather=4
      -c default_statistics_target=200
      -c max_connections=150
      -c random_page_cost=1.1
      -c log_min_duration_statement=500
      -c log_checkpoints=on
      -c max_wal_size=4GB
      -c effective_io_concurrency=200
      -c autovacuum_vacuum_cost_limit=2000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 60s
    networks:
      - fancai_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 12G
        reservations:
          cpus: '1.0'
          memory: 8G

  # Redis Cache & Queue (optimized for 32GB server, 12 vCPU)
  redis:
    image: redis:7.4.10-alpine
    container_name: fancai_redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 640mb --maxmemory-policy volatile-lru --save 900 1 300 10 60 10000
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - fancai_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 384M

  # PostgreSQL Backup (daily, 7-day retention)
  pgbackup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: fancai_pgbackup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z6 --format=custom --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=0
      - BACKUP_KEEP_MONTHS=0
      - HEALTHCHECK_PORT=8080
    volumes:
      - pgbackup_data:/backups
    networks:
      - fancai_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  beat_schedule:
    driver: local
  caddy_data:         # SSL сертификаты (Caddy управляет автоматически через Let's Encrypt)
    driver: local
  caddy_config:       # Caddy конфигурационный кеш
    driver: local
  frontend_build:     # Build артефакты фронтенда (shared: frontend -> caddy)
  nlp_models:            # HuggingFace model cache (GLiNER2, sentence-transformers)
    driver: local
  # mkdir -p /backups/postgres && chown 999:999 /backups/postgres
  pgbackup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /backups/postgres

networks:
  fancai_network:
    name: fancai_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-fancai
  monitoring_net:
    external: true
    name: app_monitoring_net
