# Конфигурация CodeQL для fancai.
#
# Suite +security-and-quality подключается из workflow и сохраняется намеренно:
# quality-запросы уже находили в прикладном коде настоящие дефекты.
name: "fancai CodeQL config"

paths-ignore:
  # Миграции Alembic генерируются по шаблону фреймворка и не являются
  # предметом ревью: revision/down_revision/branch_labels/depends_on — это
  # контракт Alembic, который читает их по имени через интроспекцию, а не
  # «неиспользуемые глобальные переменные». Применённые миграции править
  # нельзя, поэтому их находки неустранимы по определению и только маскируют
  # реальный долг в остальном коде.
  - backend/alembic/versions
