# Конфигурация Ruff для backend/.
#
# Зачем файл вообще нужен. До ruff 0.16 проект жил на неявном наборе правил
# по умолчанию — E4/E7/E9/F. В 0.16 состав правил по умолчанию расширился
# (YTT, UP, B, BLE, I, RUF и другие), и `ruff check app/` начал выдавать
# 1833 ошибки на неизменном коде. Это смена политики линтера, а не дефекты.
#
# Набор зафиксирован явно, чтобы обновление ruff больше не меняло контракт
# гейта молча. Расширять список — отдельное осознанное решение, а не
# побочный эффект бампа версии.

target-version = "py312"
line-length = 88  # согласовано с black

[lint]
select = ["E4", "E7", "E9", "F"]
