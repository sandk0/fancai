[project]
name = "fancai-backend"
version = "0.1.0"
description = "fancai backend — FastAPI + Celery, spoiler-gated entity glossary and AI illustrations"
requires-python = ">=3.12,<3.13"

# Единственный источник истины по зависимостям. Разрешение зафиксировано
# в uv.lock (с хешами); requirements.txt из репозитория удалён, а там, где
# инструмент умеет читать только его формат, файл генерируется на лету:
#   uv export --frozen --no-dev --no-emit-project -o requirements.txt
dependencies = [
    # FastAPI и веб-фреймворк
    "fastapi==0.141.1",              # Jul 2026: атомарно с prometheus-fastapi-instrumentator 8.1.0
    "uvicorn[standard]==0.52.0",
    "gunicorn==26.0.0",
    "python-multipart==0.0.32",
    "PyJWT[crypto]==2.13.0",
    "bcrypt==5.0.0",

    # База данных
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",

    # Redis и очереди
    "redis==7.3.0",
    "celery==5.6.3",                 # Jan 2026: soft shutdown, memory leak fixes, Pydantic support
    "kombu==5.6.2",                  # Required for Celery 5.6.3
    "psutil==7.2.2",

    # Парсинг книг и текста
    "beautifulsoup4==4.15.0",
    "ebooklib==0.20",
    "lxml==6.1.1",
    "razdel==0.5.0",

    # Google Gemini direct API (context caching, batch, thinking control)
    "google-genai==2.16.0",

    # HTTP-клиенты
    "httpx==0.28.1",
    "requests==2.34.2",
    "aiofiles==25.1.0",
    "aiohttp==3.14.3",

    # Валидация и настройки
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.2",

    # Логирование и мониторинг
    "loguru==0.7.3",
    "hawk-python-sdk[fastapi]==3.5.2",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",  # 7.1.0 пинил starlette<1.0.0 и держал 5 CVE

    # Безопасность
    "cryptography==50.0.0",

    # Утилиты
    "tenacity==9.1.4",               # Retry с экспоненциальной задержкой
    "circuitbreaker==2.1.3",         # Circuit breaker для OpenRouter

    # Web Push (January 2026)
    "pywebpush==2.3.0",

    # Email (Yandex Cloud Postbox — совместим с AWS SES v2)
    "aioboto3==15.5.0",

    # Graph analysis & map-reduce (Phase 6)
    "networkx==3.6.1",
]

[project.optional-dependencies]
# Ставится только в celery-образ: PyTorch CPU + GLiNER2 весят ~1,3 ГБ,
# и в API-образе им делать нечего. Путь выключен флагом USE_GLINER_NER.
nlp = [
    "torch==2.11.0+cpu",
    "gliner2==1.2.4",
]

[dependency-groups]
# Не попадает в образы: `uv sync --no-dev`.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "aiosqlite==0.22.1",
    "hypothesis==6.164.0",
    "black==26.5.1",
    "ruff==0.16.1",
    "mypy==1.19.1",
    "sqlalchemy[mypy]==2.0.51",
    "types-requests==2.33.0.20260712",
    "types-aiofiles==25.1.0.20260518",

    # Маркер greenlet у SQLAlchemy перечисляет aarch64, но не arm64, а macOS
    # на Apple Silicon сообщает именно arm64. Без явного пина локальный
    # `uv sync` оставлял бы окружение без greenlet, и семь тестов падали бы
    # с MissingGreenlet. В Linux-образах он и так приезжает через SQLAlchemy.
    "greenlet==3.5.4",
]

[tool.uv]
# Приложение не устанавливается пакетом: и в контейнере, и локально оно
# запускается из исходников по PYTHONPATH=/app. Поэтому build-backend не нужен,
# а `uv sync` собирает только зависимости.
package = false

# Дефолтный `uv sync` ставит dev-группу; образы гасят её через --no-dev.
default-groups = ["dev"]

# Известная незакрываемая находка в nlp-ветке: setuptools 81.0.0
# (PYSEC-2026-3447, исправлено в 83.0.0) приезжает транзитивно через torch,
# то есть только в celery-образ. Поднять пол нельзя — torch==2.11.0+cpu сам
# пинит setuptools<82, и `constraint-dependencies = ["setuptools>=83.0.0"]`
# делает разрешение неудовлетворимым. Путь GLiNER выключен флагом
# USE_GLINER_NER, и решение по S4 — удалить ветку целиком; это уберёт и torch,
# и находку. До тех пор гейтом служит аудит рантайма без extras (он чист),
# а полный набор аудируется отдельным неблокирующим шагом.

# torch публикуется не на PyPI. `explicit = true` означает, что из этого
# индекса берётся только то, что явно на него сослалось, — остальные пакеты
# по-прежнему идут с PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
